[user]
email = "carl.mitchell@gomotive.com"
name = "Carl Mitchell"

[fsmonitor]
backend = "watchman"
watchman.register-snapshot-trigger = true

[aliases]
yoink = ["util", "exec", "--", "bash", "-c", """
            set -e
            # Check if current commit has both description and changes
            has_description=$(jj log -r @ --no-graph --color never -T 'description' | grep -q . && echo "yes" || echo "no")
            # Use 'empty' template keyword to check if commit has changes
            has_changes=$(jj log -r @ --no-graph --color never -T 'empty' | grep -q "false" && echo "yes" || echo "no")

            if [ "$has_description" = "yes" ] && [ "$has_changes" = "yes" ]; then
                echo "Current commit has description and changes, creating new commit..."
                jj new
            fi

            # Get the bookmark from the parent commit directly
            bookmark=$(jj log -r 'ancestors(@) & bookmarks()' -n 1 --no-graph --color never -T 'bookmarks' | sed 's/\\*$//' | tr -d ' ')

            if [ -z "$bookmark" ]; then
                echo "No bookmark found on parent commit"
                exit 1
            fi

            echo "Moving bookmark '$bookmark' to parent commit and pushing..."
            jj bookmark set "$bookmark" -r @-
            jj git fetch
            jj git push --bookmark "$bookmark" --allow-new
            """
          ]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
# https://github.com/acarapetis/jj-pre-push
push = ["util", "exec", "--", "uvx", "--with", "pre-commit", "jj-pre-push", "--checker", "prek", "push"]
check = ["util", "exec", "--", "uvx", "--with", "pre-commit", "jj-pre-push", "--checker", "prek", "check"]
pushk = ["util", "exec", "--", "uvx", "--with", "pre-commit", "jj-pre-push", "--checker", "/home/carl/.config/home-manager/scripts/prek_ktmr.sh", "push"]
checkk = ["util", "exec", "--", "uvx", "--with", "pre-commit", "jj-pre-push", "--checker", "/home/carl/.config/home-manager/scripts/prek_ktmr.sh", "check"]
desc = ["util", "exec", "--", "bash", "/home/carl/.config/home-manager/scripts/conventional_commit_check.sh"]
com = ["util", "exec", "--", "bash", "/home/carl/.config/home-manager/scripts/commit_with_checks.sh"]
log3 = ["log", "--limit", "3"]
log5 = ["log", "--limit", "5"]
showdead = ["log", "-r", 'dead()']
abandead = ["abandon", 'dead()']

# megamerge aliases
# `jj stack <revset>` to include specific revs
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]
# `jj stage` to include the whole stack after the megamerge
stage = ["stack", "closest_merge(@).. ~ empty()"]
# `jj restack` to rebase your changes onto `trunk()`
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()"]

[templates]
log_node = '''
if(self && !current_working_copy && !immutable && !conflict && in_branch(self),
  "◇",
  builtin_log_node
)
'''

[template-aliases]
"in_branch(commit)" = 'commit.contained_in("immutable_heads()..bookmarks()")'

[git]
sign-on-push = true
private-commits = 'denylist()'

[signing]
backend = "ssh"
behavior = "own"
key = "/home/carl/.ssh/id_ed25519.pub"

[signing.backends]
ssh.allowed-signers = "/home/carl/.ssh/allowed_signers"
ssh.program = "ssh-keygen"

[ui]
dif-formatter = ["difft", "--color=always", "$left", "$right"]
show-cryptographic-signatures = true

[revset-aliases]
# trunk() by default resolves to the latest 'main'/'master' remote bookmark. May
# require customization for repos like nixpkgs.
'trunk()' = 'latest((present(main) | present(master)) & remote_bookmarks())'
'dead()' = '(empty() ~ merges()) & description(exact:"") & mine() & ~ root() & ~ bookmarks() & ~ tags() & ~ @'
'nodesc()' = 'description(exact:"") & ~ merges() & mine() & ~ root() & ~ bookmarks() & ~ tags() & visible_heads() & ~ @'
'my_work()' = 'mine() & visible_heads() & ~root() & ~remote_bookmarks() & ~tags()'

# Private and WIP commits that should never be pushed anywhere. Often part of
# work-in-progress merge stacks.
'wip()' = 'description(glob:"wip:*")'
'private()' = 'description(glob:"private:*")'
'goodsubject()' = 'subject(regex:"^(?<COMMIT_TYPE>feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(?<SCOPE>\\((?<JIRA_BOARD>[A-Z]{3,})-(?<TICKET_NUMBER>[0-9]+)\\))?: (?<DESCRIPTION>[a-z0-9][a-zA-Z0-9 \\-_/().,#+]*[a-zA-Z0-9\\-_/(),#+])$")'
'denylist()' = 'wip() | private() | ~ goodsubject()'
# Returns the closest merge commit to `to`
"closest_merge(to)" = "heads(::to & merges())"
'via_commits' = 'subject(regex:"^(?<COMMIT_TYPE>feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(?<SCOPE>\\(VIA-(?<TICKET_NUMBER>[0-9]+)\\))?: (?<DESCRIPTION>[a-z0-9][a-zA-Z0-9 \\-_/().,#+]*[a-zA-Z0-9\\-_/(),#+])$")'

[fix.tools.1-clang-format]
command = ["/home/carl/.nix-profile/bin/clang-format", "--style=file", "--assume-filename=$path"]
patterns = ["glob:'**/*.c'",
            "glob:'**/*.h'"]

[fix.tools.2-pre-commit]
command = ["/home/carl/.nix-profile/bin/uvx", "--with", "pre-commit", "jj-pre-push", "check"]
patterns = ["glob:'*'"]
